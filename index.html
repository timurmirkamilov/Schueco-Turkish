      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            tgBg: 'var(--tg-theme-bg-color, #f4f6f9)',
            tgSecBg: 'var(--tg-theme-secondary-bg-color, #ffffff)',
            tgText: 'var(--tg-theme-text-color, #1e293b)',

      user-select: text;
    }
    body {
      background-color: var(--tg-theme-bg-color, #f8fafc);

    }
    /* Кастомный скроллбар */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.4);
      border-radius: 9999px;
    }
    /* Анимация пульсации звука */
    @keyframes sound-wave {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.18); }
    }
    .speaking {
      animation: sound-wave 0.5s ease-in-out infinite;
    }

    // Хранилище состояния в LocalStorage
    const STORAGE_KEY = 'schueco_turkish_app_state_v1';

    let phrases = [];
    let activeTab = 'learn'; // 'learn' | 'manage'
    let selectedCategory = 'all';
    let searchQuery = '';

    // Загрузка данных
    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length > 0) {
            phrases = parsed;
            return;
          }
        }
      } catch (e) {
        console.error('Ошибка чтения localStorage:', e);
      }
      phrases = JSON.parse(JSON.stringify(INITIAL_DICTIONARY));
      saveState();
    }

    // Сохранение данных
    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(phrases));
        updateLearnedCounter();
      } catch (e) {
        console.error('Ошибка записи в localStorage:', e);
      }
    }

    // Обновление счетчика изученных слов
    function updateLearnedCounter() {
      const learnedCount = phrases.filter(p => p.learned).length;
      document.getElementById('learnedCounter').textContent = `${learnedCount}/${phrases.length}`;
    }

    // Уведомления Toast
    let toastTimeout = null;
    function showToast(text, icon = '✅') {
      const toast = document.getElementById('toast');
      const toastText = document.getElementById('toastText');
      const toastIcon = document.getElementById('toastIcon');

      toastText.textContent = text;
      toastIcon.textContent = icon;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');

      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 2000);
    }

    let turkishVoice = null;
    let currentAudio = null;

    function initVoices() {
      if ('speechSynthesis' in window && window.speechSynthesis) {
        try {
          const voices = window.speechSynthesis.getVoices() || [];
          const trVoices = voices.filter(v => {
            const lang = (v.lang || '').toLowerCase().replace('_', '-');
            return lang === 'tr' || lang.startsWith('tr-');
          });

          if (trVoices.length > 0) {
            // Приоритетный выбор мужского турецкого голоса (Ahmet, Tolga, Cem, Male, Erkek)
            const maleKeywords = ['ahmet', 'tolga', 'cem', 'male', 'erkek', 'man'];
            turkishVoice = trVoices.find(v => {
              const name = (v.name || '').toLowerCase();
              return maleKeywords.some(kw => name.includes(kw));
            }) || trVoices[0];
          } else {
            turkishVoice = null;
          }
        } catch (e) {}
      }
    }

    if ('speechSynthesis' in window && window.speechSynthesis) {
      window.speechSynthesis.onvoiceschanged = initVoices;
      initVoices();
    }

    function playOnlineTts(text, resetBtn) {
      try {
        if (currentAudio) {
          currentAudio.pause();
          currentAudio.currentTime = 0;
          currentAudio = null;
        }

        const cleanText = text.trim();
        const encoded = encodeURIComponent(cleanText);
        const providers = [
          `https://translate.google.com/translate_tts?ie=UTF-8&tl=tr&client=tw-ob&q=${encoded}`,
          `https://translate.googleapis.com/translate_tts?client=gtx&ie=UTF-8&tl=tr&q=${encoded}`,
          `https://dict.youdao.com/dictvoice?audio=${encoded}&le=tr`
        ];

        let index = 0;
        function tryNextProvider() {
          if (index >= providers.length) {
            if (resetBtn) resetBtn();
            currentAudio = null;
            showToast('Не удалось загрузить озвучку', '⚠️');
            return;
          }

          const src = providers[index++];
          const audio = new Audio();
          audio.referrerPolicy = 'no-referrer';
          audio.src = src;

          // Мужской тембр: отключаем фиксацию тона и понижаем темп речи (0.88x)
          // За счет этого частота звука сдвигается в глубокий мужской регистр
          audio.preservesPitch = false;
          audio.mozPreservesPitch = false;
          audio.webkitPreservesPitch = false;
          audio.playbackRate = 0.88;

          currentAudio = audio;

          audio.onended = () => {
            if (resetBtn) resetBtn();
            currentAudio = null;
          };

          audio.onerror = () => {
            audio.onerror = null;
            audio.onended = null;
            tryNextProvider();
          };

          const playPromise = audio.play();
          if (playPromise !== undefined) {
            playPromise.then(() => {
              triggerHaptic('light');
            }).catch(err => {
              console.warn('Playback error, trying next provider:', err);
              audio.onerror = null;
              audio.onended = null;
              tryNextProvider();
            });
          }
        }

        tryNextProvider();
      } catch (err) {
        console.error('TTS error:', err);
        if (resetBtn) resetBtn();
        showToast('Не удалось загрузить озвучку', '⚠️');
      }
    }

    function speakTurkish(text, cardId, btnElement) {
      // Ищем кнопку по переданному элементу, по ID или активному элементу
      const speakBtn = btnElement || (cardId ? document.getElementById(`speak-btn-${cardId}`) : null) || document.activeElement;
      if (speakBtn && speakBtn.classList) {
        speakBtn.classList.add('speaking', 'text-sky-600', 'scale-110');
      }

      function resetBtn() {
        if (speakBtn && speakBtn.classList) {
          speakBtn.classList.remove('speaking', 'text-sky-600', 'scale-110');
        }
      }

      // Останавливаем предыдущее аудио, если оно играет
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        currentAudio = null;
      }

      // Проверяем турецкий голос, если SpeechSynthesis доступен
      if (!turkishVoice) {
        initVoices();
      }

      // Если в браузере есть SpeechSynthesis и найден настоящий турецкий голос
      if (turkishVoice && 'speechSynthesis' in window && window.speechSynthesis) {
        try {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.voice = turkishVoice;
          utterance.lang = 'tr-TR';
          utterance.rate = 0.88;
          utterance.pitch = 0.82; // Мужской грудной регистр (0.8 - 0.85)

          let spoken = false;
          utterance.onstart = () => {
            spoken = true;
          };

          utterance.onend = () => {
            resetBtn();
          };

          utterance.onerror = (e) => {
            console.warn('Native speech error, fallback to online:', e);
            playOnlineTts(text, resetBtn);
          };

          window.speechSynthesis.speak(utterance);
          triggerHaptic('light');

          // Страховка: если через 1.5 сек нативный движок завис и не начал воспроизведение
          setTimeout(() => {
            if (!spoken && !window.speechSynthesis.speaking) {
              window.speechSynthesis.cancel();
              playOnlineTts(text, resetBtn);
            }
          }, 1500);

          return;
        } catch (e) {
          console.warn('Native TTS exception, fallback to audio:', e);
        }
      }

      // Если турецкого системного голоса нет — сразу используем онлайн TTS с естественным турецким произношением
      playOnlineTts(text, resetBtn);
    }

    // ==================== ФИЛЬТРАЦИЯ И ОТОБРАЖЕНИЕ ====================
    function getFilteredPhrases() {
      return phrases.filter(item => {
        // Фильтр по категории
        if (selectedCategory !== 'all' && item.category !== selectedCategory) {
          return false;
        }
        // Фильтр по поиску
        if (searchQuery.trim() !== '') {
          const q = searchQuery.toLowerCase().trim();
          const matchTr = item.tr.toLowerCase().includes(q);
          const matchRu = item.ru.toLowerCase().includes(q);
          const matchPhonetic = item.phonetic ? item.phonetic.toLowerCase().includes(q) : false;
          return matchTr || matchRu || matchPhonetic;
        }
        return true;
      });
    }

    // Рендер Экрана 1: Цеховой словарь / Обучение
    function renderLearnCards() {
      const container = document.getElementById('cardsContainer');
      const filtered = getFilteredPhrases();
      const emptyState = document.getElementById('emptyState');

      if (filtered.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      container.innerHTML = filtered.map((item, index) => {
        const isLearned = item.learned;
        return `
          <div class="bg-tgSecBg rounded-2xl p-4 shadow-sm border ${isLearned ? 'border-emerald-500/40 bg-emerald-50/20' : 'border-slate-200 dark:border-slate-800'} transition-all duration-200 flex flex-col justify-between space-y-3">
            
            <!-- Верхняя строка карточки: Категория и статус -->
            <div class="flex items-center justify-between">
              <span class="text-[11px] font-semibold uppercase tracking-wider px-2.5 py-0.5 rounded-full ${
                item.category === 'quality' ? 'bg-amber-100 text-amber-800 dark:bg-amber-950/60 dark:text-amber-300' :
                item.category === 'schueco' ? 'bg-blue-100 text-blue-800 dark:bg-blue-950/60 dark:text-blue-300' :
                'bg-purple-100 text-purple-800 dark:bg-purple-950/60 dark:text-purple-300'
              }">
                ${item.categoryLabel}
              </span>

              <button 
                onclick="toggleLearnedStatus('${item.id}')"
                class="flex items-center space-x-1 text-xs px-2.5 py-1 rounded-full border transition-colors ${
                  isLearned 
                    ? 'border-emerald-500 bg-emerald-50 text-emerald-700 dark:bg-emerald-950/50 dark:text-emerald-300 font-semibold' 
                    : 'border-slate-300 text-tgHint hover:border-slate-400'
                }"
              >
                <span>${isLearned ? '✓ Выучено' : '○ В процессе'}</span>
              </button>
            </div>

            <!-- Турецкая фраза и произношение -->
            <div class="flex items-start justify-between gap-3">
              <div class="space-y-1">
                <div class="text-lg sm:text-xl font-bold text-tgText tracking-wide flex items-center gap-2">
                  ${item.tr}
                </div>
                <div class="text-xs text-sky-600 dark:text-sky-400 font-medium">
                  [ ${item.phonetic} ]
                </div>
                <div class="text-sm font-medium text-tgText/90 pt-1">
                  ${item.ru}
                </div>
              </div>

              <!-- Кнопка озвучки (Динамик) -->
              <button 
                id="speak-btn-${item.id}"
                onclick="speakTurkish('${item.tr.replace(/'/g, "\\'")}', '${item.id}', this)" 
                title="Озвучить на турецком"
                class="w-12 h-12 rounded-2xl bg-sky-50 dark:bg-sky-900/40 text-sky-600 dark:text-sky-300 flex items-center justify-center shrink-0 active:scale-90 transition-transform shadow-xs hover:bg-sky-100"
              >
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zm-2.5-2.23l-5.5 4.5h-4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h4l5.5 4.5c.67.55 1.5.07 1.5-.8v-19.4c0-.87-.83-1.35-1.5-.8zM14 8.86v6.28c1.3-.61 2-1.89 2-3.14s-.7-2.53-2-3.14z"/>
                </svg>
              </button>
            </div>

            <!-- Быстрые действия внизу карточки -->
            <div class="pt-2 border-t border-slate-100 dark:border-slate-800/80 flex items-center justify-between text-xs gap-1.5">
              <button 
                onclick="moveToBeginningOfQueue('${item.id}')" 
                class="py-2 px-2.5 sm:px-3 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-tgText font-medium flex items-center justify-center space-x-1 active:scale-98 transition-transform"
                title="Переместить в самый верх списка"
              >
                <svg class="w-3.5 h-3.5 text-sky-600 dark:text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path>
                </svg>
                <span>В начало</span>
              </button>

              <button 
                onclick="moveToEndOfQueue('${item.id}')" 
                class="py-2 px-2.5 sm:px-3 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-tgText font-medium flex items-center justify-center space-x-1 active:scale-98 transition-transform"
                title="Переместить в самый конец списка"
              >
                <svg class="w-3.5 h-3.5 text-tgHint" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
                </svg>
                <span>В конец</span>
              </button>

              <button 
                onclick="markAsLearnedAndNext('${item.id}')" 
                class="flex-1 py-2 px-2.5 sm:px-3 rounded-xl bg-sky-600 hover:bg-sky-700 text-white font-semibold flex items-center justify-center space-x-1 active:scale-98 transition-transform shadow-xs"
              >
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
                <span class="truncate">${isLearned ? 'Выучено' : 'Запомнил!'}</span>
              </button>
            </div>

          </div>
        `;
      }).join('');
    }

    // Рендер Экрана 2: Управление списком и порядком
    function renderManageList() {
      const container = document.getElementById('manageListContainer');
      const filtered = getFilteredPhrases();
      const emptyState = document.getElementById('emptyState');

      if (filtered.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      container.innerHTML = filtered.map((item, index) => {
        return `
          <div class="bg-tgSecBg rounded-xl p-3 shadow-xs border border-slate-200 dark:border-slate-800 flex items-center justify-between gap-3">
            
            <!-- Левая часть: Статус и текст -->
            <div class="flex items-center space-x-3 min-w-0 flex-1">
              <button 
                onclick="toggleLearnedStatus('${item.id}')"
                class="w-6 h-6 rounded-lg flex items-center justify-center shrink-0 border transition-colors ${
                  item.learned 
                    ? 'bg-emerald-500 border-emerald-500 text-white' 
                    : 'border-slate-300 dark:border-slate-600 text-transparent'
                }"
              >
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                </svg>
              </button>

              <div class="min-w-0 flex-1">
                <div class="text-sm font-bold text-tgText truncate">${item.tr}</div>
                <div class="text-xs text-tgHint truncate">${item.ru}</div>
              </div>
            </div>

            <!-- Правая часть: Управление позицией (В самый верх / В самый низ) и озвучка -->
            <div class="flex items-center space-x-1.5 shrink-0">
              
              <!-- Звук -->
              <button 
                onclick="speakTurkish('${item.tr.replace(/'/g, "\\'")}', '${item.id}', this)" 
                class="p-2 rounded-lg bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-sky-600 dark:text-sky-400"
                title="Озвучить"
              >
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zm-2.5-2.23l-5.5 4.5h-4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h4l5.5 4.5c.67.55 1.5.07 1.5-.8v-19.4c0-.87-.83-1.35-1.5-.8zM14 8.86v6.28c1.3-.61 2-1.89 2-3.14s-.7-2.53-2-3.14z"/>
                </svg>
              </button>

              <!-- В самый верх -->
              <button 
                onclick="moveToTop('${item.id}')" 
                class="px-2.5 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-tgText text-xs font-semibold flex items-center space-x-1 active:scale-95 transition-transform"
                title="В самый верх"
              >
                <span>⬆️</span>
                <span class="hidden sm:inline">Вверх</span>
              </button>

              <!-- В самый низ -->
              <button 
                onclick="moveToBottom('${item.id}')" 
                class="px-2.5 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-tgText text-xs font-semibold flex items-center space-x-1 active:scale-95 transition-transform"
                title="В самый низ"
              >
                <span>⬇️</span>
                <span class="hidden sm:inline">Вниз</span>
              </button>
            </div>

          </div>
        `;
      }).join('');
    }

    function renderCurrentView() {
      if (activeTab === 'learn') {
        renderLearnCards();
      } else {
        renderManageList();
      }
    }

    // ==================== ДЕЙСТВИЯ СО СЛОВАМИ ====================

    // Переключение статуса «Изучено»
    function toggleLearnedStatus(id) {
      const phrase = phrases.find(p => p.id === id);
      if (phrase) {
        phrase.learned = !phrase.learned;
        saveState();
        renderCurrentView();
        triggerHaptic(phrase.learned ? 'success' : 'light');
        showToast(phrase.learned ? 'Отмечено как изученное!' : 'Возвращено на повторение', phrase.learned ? '🎓' : '🔄');
      }
    }

    // Кнопка «Запомнил!» (отмечает и смещает в конец списка)
    function markAsLearnedAndNext(id) {
      const index = phrases.findIndex(p => p.id === id);
      if (index !== -1) {
        phrases[index].learned = true;
        const [item] = phrases.splice(index, 1);
        phrases.push(item);
        saveState();
        renderCurrentView();
        triggerHaptic('success');
        showToast('Отлично! Слово отправлено в изученные', '🎉');
      }
    }

    // Перенос в начало очереди (в самый верх списка)
    function moveToBeginningOfQueue(id) {
      const index = phrases.findIndex(p => p.id === id);
      if (index === 0) {
        showToast('Фраза уже в самом верху', 'ℹ️');
        return;
      }
      moveToTop(id);
      showToast('Перенесено в начало списка', '⬆️');
    }

    // Перенос в конец очереди (в самый конец списка)
    function moveToEndOfQueue(id) {
      const index = phrases.findIndex(p => p.id === id);
      if (index === phrases.length - 1) {
        showToast('Фраза уже в самом низу', 'ℹ️');
        return;
      }
      moveToBottom(id);
      showToast('Перенесено в конец списка', '⬇️');
    }

    // Перемещение карточки в самый верх
    function moveToTop(id) {
      const index = phrases.findIndex(p => p.id === id);
      if (index > 0) {
        const [item] = phrases.splice(index, 1);
        phrases.unshift(item);
        saveState();
        renderCurrentView();
        triggerHaptic('light');
      }
    }

    // Перемещение карточки в самый низ
    function moveToBottom(id) {
      const index = phrases.findIndex(p => p.id === id);
      if (index !== -1 && index < phrases.length - 1) {
        const [item] = phrases.splice(index, 1);
        phrases.push(item);
        saveState();
        renderCurrentView();
        triggerHaptic('light');
      }
    }

    // ==================== СОБЫТИЯ И НАВИГАЦИЯ ====================

    // Переключение табов
    const tabLearnBtn = document.getElementById('tabLearnBtn');
    const tabManageBtn = document.getElementById('tabManageBtn');
    const screenLearn = document.getElementById('screenLearn');
    const screenManage = document.getElementById('screenManage');

    const TAB_ACTIVE = "py-2 text-xs sm:text-sm font-bold rounded-lg transition-all duration-200 bg-sky-600 text-white shadow-sm flex items-center justify-center space-x-1.5";
    const TAB_INACTIVE = "py-2 text-xs sm:text-sm font-medium rounded-lg transition-all duration-200 text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white flex items-center justify-center space-x-1.5";

    function switchTab(tab) {
      activeTab = tab;
      triggerHaptic('light');

      if (tab === 'learn') {
        screenLearn.classList.remove('hidden');
        screenManage.classList.add('hidden');
        tabLearnBtn.className = TAB_ACTIVE;
        tabManageBtn.className = TAB_INACTIVE;
      } else {
        screenLearn.classList.add('hidden');
        screenManage.classList.remove('hidden');
        tabManageBtn.className = TAB_ACTIVE;
        tabLearnBtn.className = TAB_INACTIVE;
      }
      renderCurrentView();
    }

    tabLearnBtn.addEventListener('click', () => switchTab('learn'));
    tabManageBtn.addEventListener('click', () => switchTab('manage'));

    // Выбор категории
    document.querySelectorAll('.cat-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedCategory = btn.dataset.category;
        triggerHaptic('light');

        document.querySelectorAll('.cat-pill').forEach(b => {
          if (b.dataset.category === selectedCategory) {
            b.className = "cat-pill px-3 py-1.5 rounded-full bg-sky-600 text-white whitespace-nowrap shadow-xs transition-colors";
          } else {
            b.className = "cat-pill px-3 py-1.5 rounded-full bg-slate-200/80 dark:bg-slate-800 text-tgHint whitespace-nowrap hover:text-tgText transition-colors";
          }
        });

        renderCurrentView();
      });
    });

    // Поиск
    const searchInput = document.getElementById('searchInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      if (searchQuery.length > 0) {
        clearSearchBtn.classList.remove('hidden');
      } else {
        clearSearchBtn.classList.add('hidden');
      }
      renderCurrentView();
    });

    clearSearchBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchQuery = '';
      clearSearchBtn.classList.add('hidden');
      renderCurrentView();
    });

    // Сброс порядка к стандартному
    document.getElementById('resetOrderBtn').addEventListener('click', () => {
      if (confirm('Сбросить порядок и фразы к заводским настройкам?')) {
        phrases = JSON.parse(JSON.stringify(INITIAL_DICTIONARY));
        saveState();
        renderCurrentView();
        showToast('Порядок сброшен к исходному', '🔄');
      }
    });

    // Стартовая инициализация
    loadState();
    switchTab('learn');

  </script>
</body>
